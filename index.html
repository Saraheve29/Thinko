<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Thinko — Think it. Plan it. Live it.</title>
  <meta name="description" content="Thinko — your all-in-one life organiser"/>
  <meta name="theme-color" content="#2d0a5e"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>"/>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#0a0118;font-family:'Segoe UI',sans-serif;overscroll-behavior:none;}
    #root{min-height:100vh;}
    ::-webkit-scrollbar{width:0;background:transparent;}
    input,textarea,select{font-family:'Segoe UI',sans-serif;}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-type="module" src="./Thinko.jsx"></script>
  <script>
    // Ensure React app mounts
    window.addEventListener('load', function() {
      setTimeout(function() {
        const root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          root.innerHTML = '<div style="color:white;text-align:center;padding:40px;font-family:sans-serif"><h2>Loading Thinko...</h2><p>If this persists, please refresh the page.</p></div>';
        }
      }, 5000);
    });
  </script>
</body>
</html>
